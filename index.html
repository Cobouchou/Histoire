  <header>
    <h1>Régimes politiques français</h1>
    <p class="soustitre" id="soustitre"></p>

    <div class="frise-toolbar">
      <button type="button" class="zoom-btn" id="zoomMoins" aria-label="Réduire la frise">−</button>
      <button type="button" class="zoom-btn" id="zoomPlus" aria-label="Agrandir la frise">+</button>
    </div>
    <div class="frise-bloc">
      <div class="frise-scroll" id="friseScroll">
        <div class="frise" id="frise" role="group" aria-label="Frise chronologique des régimes"></div>
        <div class="regle" id="regle"></div>
      </div>
    </div>
  </header>

    <div class="liste" id="liste"></div>
    <div id="fiche"></div>
  </div>

<script>
const DEBUT = -500, FIN = 2026;
// Entre les guerres médiques et la Révolution s'étendent 2254 ans que la
// frise ne représente pas à l'échelle : cette coupure les compresse à une
// largeur fixe, comme un axe brisé sur un graphique.
const COUPURE = { debut: -465, fin: 1789, largeur: 40 };

let selection = "monarchie-constitutionnelle";
let filtre = "tous";

/* ---------- Utilitaires ---------- */
const duree = p => Math.max(p.fin - p.debut, 0.3);
const visible = p => filtre === "tous" || p.type === filtre;

/* Quelques noms de la frise pointent, en toute logique, vers un article
   Wikipédia différent du nom affiché (le nom d'un titre porté avant un
   sacre, un patronyme qui désigne d'abord une famille, etc.). */
const LIENS_SPECIAUX = {
  "Bonaparte": "Napoléon Ier",
  "Comte d'Artois": "Charles X",
  "Cavaignac": "Eugène Cavaignac"
};
function lienWikipedia(nom) {
  const cible = (LIENS_SPECIAUX[nom] || nom).replace(/ /g, "_");
  return "https://fr.wikipedia.org/wiki/" + encodeURIComponent(cible);
}

/* ---------- Frise ---------- */
let PX_PAR_AN = 16; // largeur d'une année sur la frise déroulante — ajustable au pincement
const PX_PAR_AN_MIN = 6, PX_PAR_AN_MAX = 60;

function intervalleGraduation() {
  // choisit un pas rond assez grand pour que les graduations ne se chevauchent pas
  const paliers = [5, 10, 20, 25, 50, 100];
  for (const p of paliers) if (p * PX_PAR_AN >= 42) return p;
  return 200;
}

/* Convertit une année (astronomique, négative avant J.-C.) en position x,
   en comptant la coupure comme une largeur fixe plutôt que réelle. */
function anneeVersX(an) {
  const avant = (COUPURE.debut - DEBUT) * PX_PAR_AN;
  if (an <= COUPURE.debut) return (an - DEBUT) * PX_PAR_AN;
  if (an < COUPURE.fin) return avant + COUPURE.largeur * (an - COUPURE.debut) / (COUPURE.fin - COUPURE.debut);
  return avant + COUPURE.largeur + (an - COUPURE.fin) * PX_PAR_AN;
}
/* Fonction inverse, utilisée pour ancrer le zoom sous le doigt/curseur. */
function xVersAnnee(x) {
  const avant = (COUPURE.debut - DEBUT) * PX_PAR_AN;
  if (x <= avant) return DEBUT + x / PX_PAR_AN;
  if (x < avant + COUPURE.largeur) return (x - avant) < COUPURE.largeur / 2 ? COUPURE.debut : COUPURE.fin;
  return COUPURE.fin + (x - avant - COUPURE.largeur) / PX_PAR_AN;
}

function construireFrise() {
  document.getElementById("soustitre").textContent =
    PERIODES.length + " périodes, de l'Antiquité à aujourd'hui. Chaque barre est proportionnelle à sa durée — le vide entre l'Antiquité et 1789 est volontairement compressé.";

  const largeurTotale = anneeVersX(FIN);

  const f = document.getElementById("frise");
  f.innerHTML = "";
  f.style.width = largeurTotale + "px";
  PERIODES.forEach(p => {
    const largeur = duree(p) * PX_PAR_AN;
    const b = document.createElement("button");
    b.className = "seg";
    b.style.width = largeur + "px";
    b.style.background = TYPES[p.type].couleur;
    b.title = p.dates + " — " + p.nom;
    b.setAttribute("aria-label", p.nom + ", " + p.dates);
    if (largeur > 80) {
      const texte = document.createElement("span");
      texte.className = "seg-texte";
      const nom = document.createElement("span");
      nom.className = "seg-nom";
      nom.textContent = p.nom;
      texte.appendChild(nom);
      if (largeur > 150) {
        const dates = document.createElement("span");
        dates.className = "seg-dates";
        dates.textContent = p.dates;
        texte.appendChild(dates);
      }
      b.appendChild(texte);
    }
    b.onclick = () => choisir(p.id);
    f.appendChild(b);
    if (p.fin === COUPURE.debut) {
      const c = document.createElement("div");
      c.className = "coupure";
      c.style.width = COUPURE.largeur + "px";
      c.title = (COUPURE.fin - COUPURE.debut) + " ans non représentés à l'échelle";
      f.appendChild(c);
    }
  });

  const r = document.getElementById("regle");
  r.innerHTML = "";
  r.style.width = largeurTotale + "px";

  // Antiquité : un seul segment, ses deux bornes suffisent comme repères
  [DEBUT, COUPURE.debut].forEach(an => {
    const s = document.createElement("span");
    s.textContent = Math.abs(an) + " av. J.-C.";
    s.style.left = anneeVersX(an) + "px";
    r.appendChild(s);
  });

  // Époque moderne : graduation régulière, pas adapté au niveau de zoom
  const intervalle = intervalleGraduation();
  const premier = Math.ceil(COUPURE.fin / intervalle) * intervalle;
  for (let an = premier; an < FIN; an += intervalle) {
    const s = document.createElement("span");
    s.textContent = an;
    s.style.left = anneeVersX(an) + "px";
    r.appendChild(s);
  }
  appliquerEtatFrise();
}

/* ---------- Zoom de la frise (pincement tactile, trackpad, boutons) ---------- */
function definirZoom(nouveauPx, ancrageAnnee, xEcran) {
  const conteneur = document.getElementById("friseScroll");
  const rect = conteneur.getBoundingClientRect();
  PX_PAR_AN = Math.min(PX_PAR_AN_MAX, Math.max(PX_PAR_AN_MIN, nouveauPx));
  construireFrise();
  conteneur.scrollLeft = anneeVersX(ancrageAnnee) - (xEcran - rect.left);
}
function zoomBouton(facteur) {
  const conteneur = document.getElementById("friseScroll");
  const rect = conteneur.getBoundingClientRect();
  const centre = rect.left + rect.width / 2;
  const ancrageAnnee = xVersAnnee(conteneur.scrollLeft + rect.width / 2);
  definirZoom(PX_PAR_AN * facteur, ancrageAnnee, centre);
}
function initialiserZoomFrise() {
  const conteneur = document.getElementById("friseScroll");
  let distanceDepart = null, pxDepart = null, ancrageAnnee = null;
  const distance = (t0, t1) => Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
  const milieu = (t0, t1) => (t0.clientX + t1.clientX) / 2;

  conteneur.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
      distanceDepart = distance(e.touches[0], e.touches[1]);
      pxDepart = PX_PAR_AN;
      const rect = conteneur.getBoundingClientRect();
      const x = milieu(e.touches[0], e.touches[1]) - rect.left + conteneur.scrollLeft;
      ancrageAnnee = xVersAnnee(x);
    }
  }, { passive: true });

  conteneur.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && distanceDepart) {
      e.preventDefault();
      const ratio = distance(e.touches[0], e.touches[1]) / distanceDepart;
      definirZoom(pxDepart * ratio, ancrageAnnee, milieu(e.touches[0], e.touches[1]));
    }
  }, { passive: false });

  const relacher = () => { distanceDepart = null; pxDepart = null; };
  conteneur.addEventListener("touchend", relacher);
  conteneur.addEventListener("touchcancel", relacher);

  // Trackpad (pincement = molette + Ctrl dans Chrome/Safari/Firefox)
  conteneur.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const rect = conteneur.getBoundingClientRect();
    const ancrage = xVersAnnee(conteneur.scrollLeft + (e.clientX - rect.left));
    definirZoom(PX_PAR_AN * Math.exp(-e.deltaY * 0.012), ancrage, e.clientX);
  }, { passive: false });

  document.getElementById("zoomMoins").onclick = () => zoomBouton(1 / 1.35);
  document.getElementById("zoomPlus").onclick = () => zoomBouton(1.35);
}

/* ---------- Filtres ---------- */
function construireFiltres() {
  const c = document.getElementById("filtres");
  c.innerHTML = "";
  const options = [["tous", "Tous les régimes", null]].concat(
    Object.keys(TYPES).map(k => [k, TYPES[k].label, TYPES[k].couleur])
  );
  options.forEach(([val, label, couleur]) => {
    const b = document.createElement("button");
    b.className = "puce";
    b.setAttribute("aria-pressed", filtre === val);
    if (couleur) {
      const d = document.createElement("i");
      d.className = "pastille";
      d.style.background = couleur;
      b.appendChild(d);
    }
    b.appendChild(document.createTextNode(label));
    b.onclick = () => { filtre = val; rendre(); };
    c.appendChild(b);
  });
}

/* ---------- Liste ---------- */
function construireListe() {
  const l = document.getElementById("liste");
  l.innerHTML = "";
  const maxDuree = Math.max(...PERIODES.map(duree));
  PERIODES.forEach(p => {
    const b = document.createElement("button");
    b.className = "item" + (visible(p) ? "" : " cache");
    b.setAttribute("aria-pressed", selection === p.id);
    b.style.borderLeftColor = selection === p.id ? TYPES[p.type].couleur : "transparent";
    b.onclick = () => choisir(p.id);

    const haut = document.createElement("div");
    haut.className = "item-haut";
    const an = document.createElement("span");
    an.className = "item-annees";
    an.textContent = p.dates;
    haut.appendChild(an);

    const nom = document.createElement("div");
    nom.className = "item-nom";
    nom.textContent = p.nom;

    const barre = document.createElement("div");
    barre.className = "item-barre";
    barre.style.background = TYPES[p.type].couleur;
    barre.style.width = Math.max(duree(p) / maxDuree * 100, 2) + "%";

    b.append(haut, nom, barre);
    l.appendChild(b);
  });
}

/* ---------- Fiche ---------- */
function construireFiche() {
  const p = PERIODES.find(x => x.id === selection);
  const t = TYPES[p.type];
  const cible = document.getElementById("fiche");
  cible.innerHTML = "";

  const art = document.createElement("article");
  art.className = "fiche";
  art.style.setProperty("--accent", t.couleur);

  /* --- Bloc en-tête : dates, nom, résumé, l'essentiel --- */
  const blocEntete = document.createElement("div");
  blocEntete.className = "bloc";
  const entete = document.createElement("div");
  entete.className = "fiche-entete";
  const infos = document.createElement("div");
  const annees = document.createElement("p");
  annees.className = "annees";
  annees.textContent = p.dates;
  const h2 = document.createElement("h2");
  h2.textContent = p.nom;
  const d = document.createElement("p");
  d.className = "duree";
  const ans = Math.round((p.fin - p.debut) * 10) / 10;
  d.textContent = ans < 1 ? "Moins d'un an" : ans + (ans > 1 ? " ans" : " an");
  infos.append(annees, h2, d);
  const et = document.createElement("span");
  et.className = "etiquette";
  et.style.background = t.fond;
  et.style.color = t.couleur;
  et.textContent = t.label;
  entete.append(infos, et);
  blocEntete.appendChild(entete);

  const accent = document.createElement("div");
  accent.className = "fiche-accent";
  blocEntete.appendChild(accent);

  const res = document.createElement("p");
  res.className = "resume";
  res.textContent = p.resume;
  blocEntete.appendChild(res);

  if (p.cle) {
    const c = document.createElement("p");
    c.className = "cle";
    c.style.background = t.fond;
    c.style.color = t.couleur;
    c.textContent = p.cle;
    blocEntete.appendChild(c);
  }
  art.appendChild(blocEntete);

  /* --- Bloc chronologie --- */
  if (p.chrono && p.chrono.length) {
    const blocChrono = document.createElement("div");
    blocChrono.className = "bloc";
    blocChrono.appendChild(titre("Chronologie"));
    const liste = document.createElement("ul");
    liste.className = "chrono";
    p.chrono.forEach(([date, fait]) => {
      const li = document.createElement("li");
      const texte = document.createElement("p");
      const dt = document.createElement("span");
      dt.className = "date";
      dt.textContent = date;
      texte.append(dt, " — " + fait);
      li.appendChild(texte);
      liste.appendChild(li);
    });
    blocChrono.appendChild(liste);
    art.appendChild(blocChrono);
  }

  /* --- Blocs personnalités / événements, côte à côte --- */
  if ((p.gens && p.gens.length) || (p.evenements && p.evenements.length)) {
    const pied = document.createElement("div");
    pied.className = "pied";

    if (p.gens && p.gens.length) {
      const blocGens = document.createElement("div");
      blocGens.className = "bloc";
      blocGens.appendChild(titre("Personnalités"));
      const g = document.createElement("ul");
      g.className = "gens";
      p.gens.forEach(personne => {
        const { nom: n, role } = typeof personne === "string" ? { nom: personne, role: null } : { nom: personne.n, role: personne.r };
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = n;
        a.href = lienWikipedia(n);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        li.appendChild(a);
        if (role) {
          li.append(" ");
          const r = document.createElement("span");
          r.className = "role";
          r.textContent = "— " + role;
          li.appendChild(r);
        }
        g.appendChild(li);
      });
      blocGens.appendChild(g);
      pied.appendChild(blocGens);
    }

    if (p.evenements && p.evenements.length) {
      const blocEven = document.createElement("div");
      blocEven.className = "bloc";
      blocEven.appendChild(titre("Événements"));
      const ev = document.createElement("ul");
      ev.className = "gens";
      p.evenements.forEach(nom => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nom;
        a.href = lienWikipedia(nom);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        li.appendChild(a);
        ev.appendChild(li);
      });
      blocEven.appendChild(ev);
      pied.appendChild(blocEven);
    }

    art.appendChild(pied);
  }

  /* --- Bloc chute du régime --- */
  if (p.fin_texte && p.fin_texte !== "—") {
    const blocFin = document.createElement("div");
    blocFin.className = "bloc";
    blocFin.appendChild(titre(p.fin_titre || "Pourquoi le régime tombe"));
    const f = document.createElement("p");
    f.className = "fin-texte";
    f.textContent = p.fin_texte;
    blocFin.appendChild(f);
    art.appendChild(blocFin);
  }

  cible.appendChild(art);
}
function titre(texte) {
  const h = document.createElement("h3");
  h.textContent = texte;
  return h;
}

/* ---------- Orchestration ---------- */
function choisir(id) {
  selection = id;
  rendre();
  if (window.innerWidth <= 860) {
    document.getElementById("fiche").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
function appliquerEtatFrise() {
  document.querySelectorAll("#frise .seg").forEach((s, i) => {
    const p = PERIODES[i];
