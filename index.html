};
function lienWikipedia(nom) {
  const cible = (LIENS_SPECIAUX[nom] || nom).replace(/ /g, "_");
  return "https://fr.wikipedia.org/wiki/" + encodeURIComponent(cible);
}

/* ---------- Frise ---------- */
let PX_PAR_AN = 16; // largeur d'une année sur la frise déroulante — ajustable au pincement
const PX_PAR_AN_MIN = 6, PX_PAR_AN_MAX = 60;

function intervalleGraduation() {
  // choisit un pas rond assez grand pour que les graduations ne se chevauchent pas
  const paliers = [5, 10, 20, 25, 50, 100];
  for (const p of paliers) if (p * PX_PAR_AN >= 42) return p;
  return 200;
}

/* Convertit une année (astronomique, négative avant J.-C.) en position x,
   en comptant chaque coupure comme une largeur fixe plutôt que réelle. */
function anneeVersX(an) {
  let x = 0, curseur = DEBUT;
  for (const c of COUPURES) {
    if (an <= c.debut) return x + (an - curseur) * PX_PAR_AN;
    x += (c.debut - curseur) * PX_PAR_AN;
    if (an < c.fin) return x + c.largeur * (an - c.debut) / (c.fin - c.debut);
    x += c.largeur;
    curseur = c.fin;
  }
  return x + (an - curseur) * PX_PAR_AN;
}
/* Fonction inverse, utilisée pour ancrer le zoom sous le doigt/curseur. */
function xVersAnnee(x) {
  let xAcc = 0, curseur = DEBUT;
  for (const c of COUPURES) {
    const avant = xAcc + (c.debut - curseur) * PX_PAR_AN;
    if (x <= avant) return curseur + (x - xAcc) / PX_PAR_AN;
    if (x < avant + c.largeur) return (x - avant) < c.largeur / 2 ? c.debut : c.fin;
    xAcc = avant + c.largeur;
    curseur = c.fin;
  }
  return curseur + (x - xAcc) / PX_PAR_AN;
}

/* La frise empile plusieurs lignes indépendantes (une par grande catégorie),
   chacune avec sa propre hauteur, mais toutes calées sur le même axe des
   années — la coupure et le zoom s'appliquent donc identiquement à toutes. */
const LIGNES = [
  { id: "conflits", etiquette: "Conflits", hauteur: 30 },
  { id: "batailles", etiquette: "Batailles", hauteur: 22 },
  { id: "regimes", etiquette: "Régimes", hauteur: 52 }
];

function construireSegment(p, largeur, hauteur) {
  const b = document.createElement("button");
  b.className = "seg";
  b.style.width = largeur + "px";
  b.style.background = TYPES[p.type].couleur;
  b.title = p.dates + " — " + p.nom;
  b.setAttribute("aria-label", p.nom + ", " + p.dates);
  b.dataset.id = p.id;
  if (largeur > 80) {
    const texte = document.createElement("span");
    texte.className = "seg-texte";
    const nom = document.createElement("span");
    nom.className = "seg-nom";
    nom.textContent = p.nom;
    texte.appendChild(nom);
    if (largeur > 150 && hauteur >= 44) {
      const dates = document.createElement("span");
      dates.className = "seg-dates";
      dates.textContent = p.dates;
      texte.appendChild(dates);
    }
    b.appendChild(texte);
  }
  b.onclick = () => choisir(p.id);
  return b;
}

function ajouterEspace(conteneur, x0, x1) {
  if (x1 <= x0) return;
  const ajouterSpacer = (largeur) => {
    if (largeur <= 0) return;
    const s = document.createElement("div");
    s.className = "espace";
    s.style.width = largeur + "px";
    conteneur.appendChild(s);
  };
  let curseur = x0;
  COUPURES.forEach(coupure => {
    const cx0 = anneeVersX(coupure.debut), cx1 = cx0 + coupure.largeur;
    if (cx0 >= curseur && cx1 <= x1) {
      ajouterSpacer(cx0 - curseur);
      const h = document.createElement("div");
      h.className = "coupure";
      h.style.width = coupure.largeur + "px";
      h.title = (coupure.fin - coupure.debut) + " ans non représentés à l'échelle";
      conteneur.appendChild(h);
      curseur = cx1;
    }
  });
  ajouterSpacer(x1 - curseur);
}

function construireFrise() {
  document.getElementById("soustitre").textContent =
    PERIODES.length + " périodes sur " + LIGNES.length + " lignes — " + LIGNES.map(l => l.etiquette.toLowerCase()).join(", ") + " — de l'Antiquité à aujourd'hui. Chaque barre est proportionnelle à sa durée ; les grands vides entre les périodes anciennes et jusqu'à 1789 sont volontairement compressés.";

  const largeurTotale = anneeVersX(FIN);

  const etq = document.getElementById("friseEtiquettes");
  etq.innerHTML = "";
  const lignesConteneur = document.getElementById("friseLignes");
  lignesConteneur.innerHTML = "";
  lignesConteneur.style.width = largeurTotale + "px";

  LIGNES.forEach(ligne => {
    const lab = document.createElement("div");
    lab.className = "frise-etiquette-ligne";
    lab.style.height = ligne.hauteur + "px";
    lab.textContent = ligne.etiquette;
    etq.appendChild(lab);

    const row = document.createElement("div");
    row.className = "frise-ligne";
    row.style.height = ligne.hauteur + "px";
    let curseurX = 0;
    PERIODES.filter(p => p.ligne === ligne.id).sort((a, b) => a.debut - b.debut).forEach(p => {
      const debutX = anneeVersX(p.debut), finX = anneeVersX(p.fin);
      ajouterEspace(row, curseurX, debutX);
      row.appendChild(construireSegment(p, finX - debutX, ligne.hauteur));
      curseurX = finX;
    });
    lignesConteneur.appendChild(row);
  });

  const r = document.getElementById("regle");
  r.innerHTML = "";
  r.style.width = largeurTotale + "px";

  // Périodes anciennes : chacune est trop courte pour une graduation
  // régulière, ses deux bornes suffisent comme repères.
  let curseurRegle = DEBUT;
  COUPURES.forEach(c => {
    [curseurRegle, c.debut].forEach(an => {
      const s = document.createElement("span");
      s.textContent = Math.abs(an) + " av. J.-C.";
      s.style.left = anneeVersX(an) + "px";
      r.appendChild(s);
    });
    curseurRegle = c.fin;
  });

  // Époque moderne : graduation régulière, pas adapté au niveau de zoom
  const intervalle = intervalleGraduation();
  const premier = Math.ceil(curseurRegle / intervalle) * intervalle;
  for (let an = premier; an < FIN; an += intervalle) {
    const s = document.createElement("span");
    s.textContent = an;
    s.style.left = anneeVersX(an) + "px";
    r.appendChild(s);
  }
  appliquerEtatFrise();
}

/* ---------- Zoom de la frise (pincement tactile, trackpad, boutons) ---------- */
function definirZoom(nouveauPx, ancrageAnnee, xEcran) {
  const conteneur = document.getElementById("friseScroll");
  const rect = conteneur.getBoundingClientRect();
  PX_PAR_AN = Math.min(PX_PAR_AN_MAX, Math.max(PX_PAR_AN_MIN, nouveauPx));
  construireFrise();
  conteneur.scrollLeft = anneeVersX(ancrageAnnee) - (xEcran - rect.left);
}
function zoomBouton(facteur) {
  const conteneur = document.getElementById("friseScroll");
  const rect = conteneur.getBoundingClientRect();
  const centre = rect.left + rect.width / 2;
  const ancrageAnnee = xVersAnnee(conteneur.scrollLeft + rect.width / 2);
  definirZoom(PX_PAR_AN * facteur, ancrageAnnee, centre);
}
function initialiserZoomFrise() {
  const conteneur = document.getElementById("friseScroll");
  let distanceDepart = null, pxDepart = null, ancrageAnnee = null;
  const distance = (t0, t1) => Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
  const milieu = (t0, t1) => (t0.clientX + t1.clientX) / 2;

  conteneur.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
      distanceDepart = distance(e.touches[0], e.touches[1]);
      pxDepart = PX_PAR_AN;
      const rect = conteneur.getBoundingClientRect();
      const x = milieu(e.touches[0], e.touches[1]) - rect.left + conteneur.scrollLeft;
      ancrageAnnee = xVersAnnee(x);
    }
  }, { passive: true });

  conteneur.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && distanceDepart) {
      e.preventDefault();
      const ratio = distance(e.touches[0], e.touches[1]) / distanceDepart;
      definirZoom(pxDepart * ratio, ancrageAnnee, milieu(e.touches[0], e.touches[1]));
    }
  }, { passive: false });

  const relacher = () => { distanceDepart = null; pxDepart = null; };
  conteneur.addEventListener("touchend", relacher);
  conteneur.addEventListener("touchcancel", relacher);

  // Trackpad (pincement = molette + Ctrl dans Chrome/Safari/Firefox)
  conteneur.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const rect = conteneur.getBoundingClientRect();
    const ancrage = xVersAnnee(conteneur.scrollLeft + (e.clientX - rect.left));
    definirZoom(PX_PAR_AN * Math.exp(-e.deltaY * 0.012), ancrage, e.clientX);
  }, { passive: false });

  document.getElementById("zoomMoins").onclick = () => zoomBouton(1 / 1.35);
  document.getElementById("zoomPlus").onclick = () => zoomBouton(1.35);
}

/* ---------- Liste ---------- */
function construireListe() {
  const l = document.getElementById("liste");
  l.innerHTML = "";
  const maxDuree = Math.max(...PERIODES.map(duree));
  PERIODES.forEach(p => {
    const b = document.createElement("button");
    b.className = "item";
    b.setAttribute("aria-pressed", selection === p.id);
    b.style.borderLeftColor = selection === p.id ? TYPES[p.type].couleur : "transparent";
    b.onclick = () => choisir(p.id);

    const haut = document.createElement("div");
    haut.className = "item-haut";
    const an = document.createElement("span");
    an.className = "item-annees";
    an.textContent = p.dates;
    haut.appendChild(an);

    const nom = document.createElement("div");
    nom.className = "item-nom";
    nom.textContent = p.nom;

    const barre = document.createElement("div");
    barre.className = "item-barre";
    barre.style.background = TYPES[p.type].couleur;
    barre.style.width = Math.max(duree(p) / maxDuree * 100, 2) + "%";

    b.append(haut, nom, barre);
    l.appendChild(b);
  });
}

/* ---------- Fiche ---------- */
/* Un fragment de texte peut contenir **gras** et [libellé](url) : on les
   convertit en vrais nœuds plutôt que d'utiliser innerHTML. */
function rendreTexteRiche(el, texte) {
  const re = /\*\*(.+?)\*\*|\*(.+?)\*|\[([^\]]+)\]\(((?:[^()]|\([^)]*\))*)\)/g;
  let dernier = 0, m;
  while ((m = re.exec(texte))) {
    if (m.index > dernier) el.append(texte.slice(dernier, m.index));
    if (m[1] !== undefined) {
      const b = document.createElement("strong");
      b.textContent = m[1];
      el.appendChild(b);
    } else if (m[2] !== undefined) {
      const i = document.createElement("em");
      i.textContent = m[2];
      el.appendChild(i);
    } else {
      const a = document.createElement("a");
      a.textContent = m[3];
      a.href = m[4];
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "lien-inline";
      el.appendChild(a);
    }
    dernier = re.lastIndex;
  }
  if (dernier < texte.length) el.append(texte.slice(dernier));
}

/* Une entrée de chronologie est [date, texte] ou [date, texte, sousPuces]. */
function construireChrono(entrees) {
  const liste = document.createElement("ul");
  liste.className = "chrono";
  entrees.forEach(([date, fait, sous]) => {
    const li = document.createElement("li");
    const corpsLi = document.createElement("div");
    corpsLi.className = "chrono-corps";
    const texte = document.createElement("p");
    const dt = document.createElement("span");
    dt.className = "date";
    dt.textContent = date;
    texte.appendChild(dt);
    texte.append(" — ");
    rendreTexteRiche(texte, fait);
    corpsLi.appendChild(texte);
    if (sous && sous.length) {
      const sousListe = document.createElement("ul");
      sousListe.className = "sous-chrono";
      sous.forEach(ligneTexte => {
        const sousLi = document.createElement("li");
        const texteSpan = document.createElement("span");
        rendreTexteRiche(texteSpan, ligneTexte);
        sousLi.appendChild(texteSpan);
        sousListe.appendChild(sousLi);
      });
      corpsLi.appendChild(sousListe);
    }
    li.appendChild(corpsLi);
    liste.appendChild(li);
  });
  return liste;
}

/* Personnalités et Événements, côte à côte quand les deux existent. */
function construirePied(gens, evenements) {
  if (!(gens && gens.length) && !(evenements && evenements.length)) return null;
  const pied = document.createElement("div");
  pied.className = "pied";

  if (gens && gens.length) {
    const colGens = document.createElement("div");
    colGens.appendChild(titre("Personnalités"));
    const g = document.createElement("ul");
    g.className = "gens";
    gens.forEach(personne => {
      const { nom: n, role } = typeof personne === "string" ? { nom: personne, role: null } : { nom: personne.n, role: personne.r };
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.textContent = n;
      a.href = typeof personne === "object" && personne.url ? personne.url : lienWikipedia(n);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      li.appendChild(a);
      if (role) {
        li.append(" ");
        const r = document.createElement("span");
        r.className = "role";
        r.textContent = "— " + role;
        li.appendChild(r);
      }
      g.appendChild(li);
    });
    colGens.appendChild(g);
    pied.appendChild(colGens);
  }

  if (evenements && evenements.length) {
    const colEven = document.createElement("div");
    colEven.appendChild(titre("Événements"));
    const ev = document.createElement("ul");
    ev.className = "gens";
    evenements.forEach(evenement => {
      const { nom, url } = typeof evenement === "string" ? { nom: evenement, url: null } : evenement;
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.textContent = nom;
      a.href = url || lienWikipedia(nom);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      li.appendChild(a);
      ev.appendChild(li);
    });
    colEven.appendChild(ev);
    pied.appendChild(colEven);
  }

  return pied;
}

function construireFiche() {
  const p = PERIODES.find(x => x.id === selection);
  const t = TYPES[p.type];
  const cible = document.getElementById("fiche");
  cible.innerHTML = "";

  const art = document.createElement("article");
  art.className = "fiche";
  art.style.setProperty("--accent", t.couleur);
  art.style.setProperty("--accent-fond", t.fond);

  /* --- En-tête : bandeau plein format coloré selon le type --- */
  const entete = document.createElement("div");
  entete.className = "fiche-entete";
  const titreEntete = document.createElement("p");
  titreEntete.className = "entete-titre";
  titreEntete.textContent = p.dates + " " + p.nom;
  const d = document.createElement("p");
  d.className = "entete-duree";
  const ans = Math.round((p.fin - p.debut) * 10) / 10;
  d.textContent = ans < 1 ? "Moins d'un an" : ans + (ans > 1 ? " ans" : " an");
  entete.append(titreEntete, d);
  art.appendChild(entete);

  /* --- Corps : tout le reste, dans la même carte --- */
  const corps = document.createElement("div");
  corps.className = "fiche-corps";
  const aDuContenu = p.resume || p.cle || (p.chrono && p.chrono.length) || (p.sections && p.sections.length);

  if (p.resume) {
    const res = document.createElement("p");
    res.className = "resume";
    res.textContent = p.resume;
    corps.appendChild(res);
  }

  if (p.cle) {
    const c = document.createElement("p");
    c.className = "cle";
    c.style.background = t.fond;
    c.style.color = t.couleur;
    c.textContent = p.cle;
    corps.appendChild(c);
  }

  if (p.chrono && p.chrono.length) {
    corps.appendChild(titre("Chronologie"));
    corps.appendChild(construireChrono(p.chrono));
    const pied = construirePied(p.gens, p.evenements);
    if (pied) corps.appendChild(pied);
  }

  /* --- Fiches à sections multiples (une même période racontée en
     plusieurs temps, chacun avec sa propre chronologie) --- */
  if (p.sections && p.sections.length) {
    p.sections.forEach(sec => {
      corps.appendChild(titre(sec.titre));
      if (sec.chrono && sec.chrono.length) corps.appendChild(construireChrono(sec.chrono));
      const pied = construirePied(sec.gens, sec.evenements);
      if (pied) corps.appendChild(pied);
    });
  }

  if (!p.chrono && !(p.sections && p.sections.length)) {
    const pied = construirePied(p.gens, p.evenements);
    if (pied) corps.appendChild(pied);
  }

  if (!aDuContenu) {
    const vide = document.createElement("p");
    vide.className = "vide";
    vide.textContent = "Fiche pas encore rédigée.";
    corps.appendChild(vide);
  }

  if (p.fin_texte && p.fin_texte !== "—") {
    corps.appendChild(titre(p.fin_titre || "Pourquoi le régime tombe"));
    const f = document.createElement("p");
    f.className = "fin-texte";
    f.textContent = p.fin_texte;
    corps.appendChild(f);
  }

  art.appendChild(corps);
  cible.appendChild(art);
}
function titre(texte) {
  const h = document.createElement("h3");
  h.textContent = texte;
  return h;
}

/* ---------- Orchestration ---------- */
function choisir(id) {
  selection = id;
  rendre();
  if (window.innerWidth <= 860) {
    document.getElementById("fiche").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
function appliquerEtatFrise() {
  document.querySelectorAll("#friseLignes .seg").forEach(s => {
    s.setAttribute("aria-pressed", s.dataset.id === selection);
  });
}
function rendre() {
  construireListe();
  construireFiche();
  appliquerEtatFrise();
}

(function () {
  construireFrise();
  rendre();
  initialiserZoomFrise();
})();
</script>
